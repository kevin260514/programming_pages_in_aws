# Nginx de PRODUCCION (PAG-25)
# - Sirve el frontend estatico.
# - Reenvia /api/* al backend, asi el navegador solo habla con UN origen
#   (sin CORS y sin exponer el puerto 8080 a internet).

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # DNS interno de Docker. Con variable + resolver, nginx no falla al
    # arrancar si el backend aun no esta listo.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    75s;  # mayor que GEMINI_TIMEOUT_SECONDS (60)
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Los CSS/JS cambian con cada entrega: cache corta para ver las
    # actualizaciones rapido.
    location ~* \.(css|js)$ {
        expires 10m;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
