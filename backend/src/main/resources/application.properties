spring.application.name=pag-backend
server.port=8080

# ---------- PostgreSQL (valores por defecto; Docker Compose los sobreescribe) ----------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pagdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:paguser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:pagpass}

# ---------- JPA ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
