services:
  db:
    image: postgres:16-alpine
    container_name: pag-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pagdb}
      POSTGRES_USER: ${POSTGRES_USER:-paguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pagpass}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-paguser} -d ${POSTGRES_DB:-pagdb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: pag-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-pagdb}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-paguser}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-pagpass}
      # Asistente de IA (PAG-30). Si no defines GEMINI_API_KEY el resto de la app funciona igual.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build: ./frontend
    container_name: pag-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  postgres-data:
